apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    app.kubernetes.io/component: gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway
  labels:
    app.kubernetes.io/component: gateway
rules:
- apiGroups:
  - governance.aip.io
  resources:
  - agentrequests
  - agentrequests/status
  - agenttrustprofiles
  - agenttrustprofiles/status
  - auditrecords
  - diagnosticaccuracysummaries
  - diagnosticaccuracysummaries/status
  - governedresources
  - governedresources/status
  - safetypolicies
  - agentgraduationpolicies
  - agentgraduationpolicies/status
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - governance.aip.io
  resources:
  - agentregistrations
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - governance.aip.io
  resources:
  - agentregistrations/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - governance.aip.io
  resources:
  - mcpservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway
  labels:
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway
subjects:
- kind: ServiceAccount
  name: gateway
  namespace: aip-k8s-system
